    <!-- Sidebar -->

        <nav class="sidebar-nav">
            <p class="nav-section">Menu Utama</p>

            <a href="admin-dashboard.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="admin-users.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Kelola User</span>
            </a>
            <a href="admin-teams.html" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Kelola Tim</span>
            </a>
            <a href="admin-links.html" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span>Link Tim</span>
            </a>
            <a href="admin-innovation-links.html" class="nav-link">

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <span class="avatar">A</span>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">Admin BOLATA</span>
                    <span class="sidebar-user-role">Admin</span>
                </div>
            </div>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main">
        <!-- Topbar Header -->
        <header class="topbar">
            <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Buka menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>

            <div class="topbar-title">
                <h1 class="topbar-heading">Tambah Tim</h1>
            </div>

            <div class="topbar-right">
                <div class="topbar-user">
                    <span class="avatar avatar-sm">A</span>
                    <div class="topbar-user-info">
                        <span class="topbar-user-name">Admin BOLATA</span>
                        <span class="topbar-user-role">Admin</span>
                    </div>
                </div>
                <button type="button" class="btn btn-outline btn-sm logout-btn">Keluar</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <div class="page-head">
                <div>
                    <h2 class="page-title">Tambah Tim</h2>
                    <p class="page-subtitle">Tambahkan tim baru.</p>
                </div>
            </div>

            <div class="card">
                <form id="create-team-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="name">Nama Tim <span class="required">*</span></label>
                            <input class="form-input" type="text" name="name" id="name" placeholder="Contoh: Tim Teknologi Informasi" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Deskripsi Tim</label>
                            <textarea class="form-input" name="description" id="description" rows="4" placeholder="Jelaskan fungsi dan tanggung jawab tim."></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a href="admin-teams.html" class="btn btn-outline">Batal</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="js/data-store.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-dock.js"></script>
<script>
    document.getElementById('create-team-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        sessionStorage.setItem('bolata_flash', `Mode Preview Statis: Simulasi input tim "${name}" berhasil (data dummy tetap paten).`);
        window.location.href = 'admin-teams.html';
    });
</script>
</body>
</html>
