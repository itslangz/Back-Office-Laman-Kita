<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk · BOLATA</title>
    <link rel="icon" type="image/png" href="images/maskot.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/demo-dock.css">
</head>
<body class="guest-body">
    <div class="container-login">
        <div class="wrap-login">
            <div class="login-brand">
                <span class="brand-mark brand-mark-lg"><img src="images/logobps.png" alt="Logo BPS"></span>
                <div class="brand-text">
                    <span class="brand-name brand-name-lg">BOLATA</span>
                    <span class="brand-sub">Back Office LAman Kita</span>
                </div>
            </div>

            <h2 class="login-title">Selamat Datang</h2>
            <p class="login-subtitle">Masuk untuk mengakses link tim dan inovasi.</p>

            <form id="login-form">
                <div class="login-input-group">
                    <label for="email" class="login-label">Email</label>
                    <div class="login-input-wrap">
                        <span class="login-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input class="login-input" type="email" name="email" id="email" value="admin@bolata.test" placeholder="nama@example.com" required autofocus>
                        <span class="login-focus-line"></span>
                    </div>
                </div>

                <div class="login-input-group">
                    <label for="password" class="login-label">Password</label>
                    <div class="login-input-wrap">
                        <span class="login-input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input class="login-input" type="password" name="password" id="password" value="password" placeholder="Masukkan password" required>
                        <span class="login-focus-line"></span>
                    </div>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="remember" checked>
                    <span>Ingat saya</span>
                </label>

                <div class="login-btn-wrap">
                    <div class="login-btn-bg"></div>
                    <button type="submit" class="login-btn">Masuk</button>
                </div>
            </form>

            <div style="margin-top: 24px; padding-top: 18px; border-top: 1px dashed #E2E8F0; text-align: center;">
                <p style="font-size: 12px; color: #64748B; font-weight: 600; margin-bottom: 10px;">AKSES CEPAT DEMO:</p>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button type="button" class="btn btn-outline btn-sm" id="btn-quick-admin" style="justify-content: flex-start; font-size: 12px;">
                        <span>🛡️</span> <strong>Admin BOLATA</strong> <span style="color:#64748B; margin-left:auto;">admin@bolata.test</span>
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" id="btn-quick-budi" style="justify-content: flex-start; font-size: 12px;">
                        <span>👤</span> <strong>Budi Santoso (TI)</strong> <span style="color:#64748B; margin-left:auto;">budi@bolata.test</span>
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" id="btn-quick-siti" style="justify-content: flex-start; font-size: 12px;">
                        <span>👤</span> <strong>Siti Rahayu (Keuangan)</strong> <span style="color:#64748B; margin-left:auto;">siti@bolata.test</span>
                    </button>
                </div>
            </div>
        </div>
        <p class="auth-footer">© 2026 BOLATA — Back Office LAman Kita</p>
    </div>

    <script src="js/data-store.js"></script>
    <script src="js/app.js"></script>
    <script src="js/demo-dock.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const user = BolataStore.login(email);
            if (user && user.role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            } else {
                window.location.href = 'user-dashboard.html';
            }
        });

        document.getElementById('btn-quick-admin').addEventListener('click', function() {
            BolataStore.login('admin@bolata.test');
            window.location.href = 'admin-dashboard.html';
        });

        document.getElementById('btn-quick-budi').addEventListener('click', function() {
            BolataStore.login('budi@bolata.test');
            window.location.href = 'user-dashboard.html';
        });

        document.getElementById('btn-quick-siti').addEventListener('click', function() {
            BolataStore.login('siti@bolata.test');
            window.location.href = 'user-dashboard.html';
        });
    </script>
</body>
</html>
