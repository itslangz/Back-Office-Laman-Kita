        <!-- Main Content -->
        <main class="content">
            <div class="page-head">
                <div>
                    <h2 class="page-title">Edit Link Tim</h2>
                    <p class="page-subtitle">Perbarui link tim.</p>
                </div>
            </div>

            <div class="card">
                <form id="edit-link-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="team_id">Tim <span class="required">*</span></label>
                            <select class="form-input" name="team_id" id="team_id" required>
                                <option value="">-- Pilih Tim --</option>
                                <!-- Hydrated dynamically -->
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="title">Judul Link <span class="required">*</span></label>
                            <input class="form-input" type="text" name="title" id="title" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="url">URL <span class="required">*</span></label>
                            <input class="form-input" type="url" name="url" id="url" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Deskripsi</label>
                            <textarea class="form-input" name="description" id="description" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Simpan</button>
                        <a href="admin-links.html" class="btn btn-outline">Batal</a>
                    </div>
                </form>
            </div>
        </main>

<script src="js/data-store.js"></script>
<script src="js/app.js"></script>
<script src="js/demo-dock.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = parseInt(urlParams.get('id') || '1', 10);
        const link = BolataStore.getLink(linkId) || BolataStore.getLinks()[0];

        const teams = BolataStore.getTeams();
        const select = document.getElementById('team_id');
        teams.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.name;
            if (link && link.team_id == t.id) opt.selected = true;
            select.appendChild(opt);
        });

        if (link) {
            document.getElementById('title').value = link.title;
            document.getElementById('url').value = link.url;
            document.getElementById('description').value = link.description || '';
        }

        document.getElementById('edit-link-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const team_id = parseInt(document.getElementById('team_id').value, 10);
            const title = document.getElementById('title').value.trim();
            const url = document.getElementById('url').value.trim();
            const description = document.getElementById('description').value.trim();

            if (link) {
                BolataStore.updateLink(link.id, { team_id, title, url, description });
                sessionStorage.setItem('bolata_flash', `Link "${title}" berhasil diperbarui.`);
            }
            window.location.href = 'admin-links.html';
        });
    });
</script>
</body>
</html>
