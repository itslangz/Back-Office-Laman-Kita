<script src="js/data-store.js"></script>

<script src="js/demo-dock.js"></script>
<script>
    function showAlert(msg, type = 'success') {
        const container = document.getElementById('alert-container');
        container.innerHTML = `<div class="alert alert-${type}" data-auto-dismiss>${msg}</div>`;
        setTimeout(() => {
            const el = container.querySelector('.alert');
            if (el) el.remove();
        }, 4000);
    }

    function renderInnovations() {
        const links = BolataStore.getInnovationLinks();
        const tbody = document.getElementById('innovations-table-body');

        if (links.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty">Belum ada link inovasi.</td></tr>';
            return;
        }

        tbody.innerHTML = links.map(l => {
            return `
                <tr>
                    <td><strong>${l.title}</strong></td>
                    <td><a href="${l.url}" target="_blank" rel="noopener" class="link-url">${l.url}</a></td>
                    <td class="cell-desc">${l.description || '-'}</td>
                    <td>
                        <div class="table-actions">
                            <a href="admin-innovation-link-edit.html?id=${l.id}" class="btn btn-info btn-sm">Edit</a>
                            <button type="button" class="btn btn-danger btn-sm" onclick="handleDeleteInnovation(${l.id}, '${escapeHtml(l.title)}')">Hapus</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function escapeHtml(text) {
        return text.replace(/'/g, "\\'");
    }

    function handleDeleteInnovation(id, title) {
        if (confirm(`Yakin ingin menghapus link "${title}"?`)) {
            BolataStore.deleteInnovationLink(id);
            showAlert(`Link inovasi "${title}" berhasil dihapus.`);
            renderInnovations();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const flashMsg = sessionStorage.getItem('bolata_flash');
        if (flashMsg) {
            showAlert(flashMsg);
            sessionStorage.removeItem('bolata_flash');
        }
        renderInnovations();
    });
</script>
